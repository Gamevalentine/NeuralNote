name: NOTIQ Stage 5G Browser Piano UI and MIDI Export QA
on:
  push:
    branches: [feature/notiq-stage5g-transkun-v2-piano]
    paths:
      - .github/workflows/notiq-stage5g-browser-qa.yml
      - notiq-ai-core/qa/transkun-browser.mjs
      - web/src/App.tsx
      - web/src/transkunProtocol.ts
      - web/src/transkunNative.ts
  workflow_dispatch:
permissions:
  contents: read
jobs:
  piano-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build approved React UI
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Use Chromium to verify per-engine isolation and actual MIDI export
        run: |
          npm install --prefix /tmp/notiq-stage5g-playwright --no-audit --no-fund playwright-core@1.56.1
          node notiq-ai-core/qa/transkun-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notiq-stage5g-piano-browser-evidence
          path: /tmp/notiq-stage5g-piano-preview.png
          if-no-files-found: warn
          retention-days: 7
