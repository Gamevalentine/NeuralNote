name: NOTIQ 5P-D Real Piano Large Diagnostics QA
on:
  push:
    branches: [feature/notiq-stage5pd-real-piano-benchmark]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notiq-5pd-${{ github.ref }}
  cancel-in-progress: false
jobs:
  algorithm-preflight:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout NOTIQ test scripts
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test real benchmark scorer and license-aware corpus gates
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check mido==1.3.3 psutil==6.1.1
          python -m unittest discover -s scripts/5pd -p "test_5pd.py" -v
          if($LASTEXITCODE -ne 0){throw '5PD benchmark verifier tests failed'}
          Write-Host 'NOTIQ_5PD_BENCHMARK_GATE_TESTS_PASS_NOT_REAL_INFERENCE'
  real-audio-large:
    needs: algorithm-preflight
    # One costly real Large run is triggered only by the reviewed [5PD_RUN]
    # commit or workflow_dispatch, never by every rapid source commit.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[5PD_RUN]') }}
    runs-on: windows-latest
    timeout-minutes: 110
    env:
      HF_MODEL_URL: https://huggingface.co/DamRsn/muscriptor-gguf/resolve/d7045f94e8b19427f4ff9542975035e66596e51c/v1/muscriptor-large-f16.gguf
      PINNED_GGUF_SHA: 35a750fb1ab1e77195cdc2c0b9b4aeea2f4d59f11f729f02af9920c4854ef72e
    steps:
      - name: Checkout full pinned native source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install benchmark-only dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check mido==1.3.3 psutil==6.1.1 imageio-ffmpeg==0.6.0
          $ffmpeg=python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          if(-not (Test-Path $ffmpeg)){throw 'FFmpeg binary missing'}
          "NOTIQ_FFMPEG=$ffmpeg" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Prepare two untouched CC BY 4.0 real Vienna audio/MIDI pairs
        shell: pwsh
        run: |
          $folder=Join-Path $env:RUNNER_TEMP 'notiq-5pd-vienna'
          python scripts/5pd/prepare_vienna.py --outdir $folder --allow-short-smoke
          if($LASTEXITCODE -ne 0){throw 'Official Vienna dataset unavailable, no real audio run can be claimed'}
          $manifest=Get-Content (Join-Path $folder 'dataset-manifest.json') -Raw | ConvertFrom-Json
          if($manifest.samples.Count -lt 1){throw 'No real piano recording and corresponding MIDI'}
          if(($manifest.samples | Where-Object {$_.license -ne 'CC-BY-4.0'}).Count -gt 0){throw 'Unexpected dataset license'}
          "NOTIQ_VIENNA_DIR=$folder" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'NOTIQ_5PD_REAL_CORPUS_PAIRED_NOT_YET_INFERRED'
      - name: Detect supported MSVC generator and build native CLI from source
        shell: pwsh
        run: |
          $generators=cmake --help | Out-String
          if($generators -match 'Visual Studio 18 2026'){$generator='Visual Studio 18 2026'}
          elseif($generators -match 'Visual Studio 17 2022'){$generator='Visual Studio 17 2022'}
          else{throw 'No Windows MSVC toolchain'}
          cmake -S notiq-native -B build-5pd -G "$generator" -A x64 -DMUSCRIPTOR_VULKAN=OFF -DMUSCRIPTOR_METAL=OFF
          if($LASTEXITCODE -ne 0){throw '5PD configure failed'}
          cmake --build build-5pd --config Release --target notiq-muscriptor-cli --parallel 2
          if($LASTEXITCODE -ne 0){throw '5PD native build failed'}
          $cli=Get-ChildItem build-5pd -Recurse -File -Filter 'notiq-muscriptor-cli.exe' | Select-Object -First 1
          if(-not $cli){throw 'Real native bridge CLI missing'}
          $check=& $cli.FullName --self-test-checkpoint
          if($LASTEXITCODE -ne 0 -or "$check" -notmatch 'NOTIQ_5MC_CHECKPOINT_SELF_TEST_PASS'){throw 'Native checkpoint self-test failed'}
          "NOTIQ_NATIVE_CLI=$($cli.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'NOTIQ_5PD_NATIVE_SOURCE_BUILD_PASS_NO_INFERENCE_YET'
      - name: Fetch original pinned 2.74 GB Large GGUF and SHA-256 verify
        shell: pwsh
        run: |
          $model=Join-Path $env:RUNNER_TEMP 'muscriptor-large-f16.gguf'
          curl.exe --fail --location --retry 2 --retry-delay 15 --connect-timeout 60 --output "$model" "$env:HF_MODEL_URL"
          if($LASTEXITCODE -ne 0){throw 'Official MuScriptor Large download failed; no benchmark may be claimed'}
          $actual=(Get-FileHash $model -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $env:PINNED_GGUF_SHA){throw 'Large model SHA256 mismatch; abort without inference'}
          if((Get-Item $model).Length -ne 2739142176){throw 'Large GGUF byte size mismatch'}
          "NOTIQ_LARGE_MODEL=$model" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'NOTIQ_5PD_ACTUAL_LARGE_WEIGHTS_VERIFIED'
      - name: Run real 20-second acoustic excerpt through Large with bounded diagnostics
        shell: pwsh
        run: |
          $manifest=Get-Content (Join-Path $env:NOTIQ_VIENNA_DIR 'dataset-manifest.json') -Raw | ConvertFrom-Json
          $sample=$manifest.samples[0]
          $audio=Join-Path $env:NOTIQ_VIENNA_DIR $sample.audio_file
          $midi=Join-Path $env:NOTIQ_VIENNA_DIR $sample.midi_file
          $report=Join-Path $env:RUNNER_TEMP 'notiq-5pd-real-large-results.json'
          python scripts/5pd/benchmark_real_piano.py --audio "$audio" --reference "$midi" --model "$env:NOTIQ_LARGE_MODEL" --cli "$env:NOTIQ_NATIVE_CLI" --ffmpeg "$env:NOTIQ_FFMPEG" --threads 4 --checkpoint --license-id CC-BY-4.0 --excerpt-seconds 20 --timeout 900 --report "$report"
          if($LASTEXITCODE -ne 0){throw 'Real Large inference incomplete; do not label 5PD PASS'}
          $result=Get-Content $report -Raw | ConvertFrom-Json
          if($result.test_kind -ne 'REAL_ACOUSTIC_EXCERPT_SMOKE_NOT_FULL_LENGTH'){
            throw 'Incorrect provenance: this is strictly a real 20-second excerpt smoke test'
          }
          Write-Host 'NOTIQ_5PD_REAL_20SEC_LARGE_SMOKE_COMPLETED_NOT_FULL_SONG'
          Write-Host "REAL measured F1 $($result.score.f1_raw), native RAM $($result.metrics.peak_native_rss_bytes) bytes"
      - name: Upload privacy-safe real measurement report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NOTIQ-5PD-RealAudio-Large-Excerpt-Diagnostics-ONLY
          path: ${{ runner.temp }}/notiq-5pd-real-large-results.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 8
