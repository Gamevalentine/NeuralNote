name: NOTIQ Stage 5N-C Per-Note Velocity Windows QA
on:
  push:
    branches: [feature/notiq-stage5nc-note-velocity]
  pull_request:
    branches: [feature/notiq-stage5nb-note-accuracy]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify evidence gates, CLI progress and reference MIDI regressions
        shell: pwsh
        run: |
          node --test desktop-preview/tests/native-thread-spawn.test.cjs desktop-preview/tests/cpu-threads.test.cjs desktop-preview/tests/cpu-benchmark.test.cjs desktop-preview/tests/native-progress.test.cjs desktop-preview/tests/models.test.cjs
          if($LASTEXITCODE -ne 0){throw 'CPU/CLI tests failed'}
          node --check desktop-preview/main.cjs
          node --check desktop-preview/preload.cjs
          node --check desktop-preview/repack-5md.cjs
          if($LASTEXITCODE -ne 0){throw 'Electron syntax failed'}
      - name: React TypeScript and MIDI accuracy tests
        shell: pwsh
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          if($LASTEXITCODE -ne 0){throw 'Web dependencies failed'}
          npm run build
          if($LASTEXITCODE -ne 0){throw '5M-D TypeScript build failed'}
          node --experimental-strip-types --test tests/stage5md-audit.test.mts tests/reference-benchmark.test.mts tests/note-quality.test.mts tests/velocity-from-audio.test.mts tests/daw-midi.test.mts tests/note-quality-5nb.test.mts tests/velocity-editor-5nc.test.mts tests/piano-edit.test.mts
          if($LASTEXITCODE -ne 0){throw 'Audit/MIDI regression test failed'}
      - uses: actions/download-artifact@v4
        with:
          repository: Gamevalentine/NeuralNote
          run-id: 39838381380
          name: NOTIQ-Stage5M-C-Resumable-Windows-Preview
          github-token: ${{ github.token }}
          path: notiq-stage5md-base
      - name: Verify actual C++ checkpoint support and pack audited UI
        shell: pwsh
        run: |
          npm install --prefix package-tools --no-audit --no-fund @electron/asar@3
          if($LASTEXITCODE -ne 0){throw 'ASAR dependency failed'}
          $asar=Get-ChildItem notiq-stage5md-base -Recurse -File -Filter app.asar | Select-Object -First 1
          if(-not $asar){throw '5M-C portable base missing'}
          $resources=Split-Path $asar.FullName -Parent
          $cli=Join-Path $resources 'bridge-bin/notiq-muscriptor-cli.exe'
          if(-not (Test-Path $cli)){throw 'Resumable native binary missing'}
          $cap=(& $cli --capabilities) | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $cap.resume_checkpoint -ne $true -or ($cap.cpu_threads -join ',') -ne '2,4,6'){throw 'Wrong native binary'}
          $self=& $cli --self-test-checkpoint
          if($LASTEXITCODE -ne 0 -or "$self" -notmatch 'NOTIQ_5MC_CHECKPOINT_SELF_TEST_PASS'){throw 'C++ checkpoint roundtrip failed'}
          node desktop-preview/repack-5md.cjs "$($asar.FullName)" "$((Resolve-Path web/dist).Path)"
          if($LASTEXITCODE -ne 0){throw 'Electron 5M-D repack failed'}
          $appRoot=Split-Path $resources -Parent
          @(
           'NOTIQ Stage 5M-D -- Windows Portable offline acceptance edition'
           'Extract onto E: and copy existing models and NOTIQ-Data next to the executable.'
           'Open same source song, run AI 5M-B 2/4/6 threads twice each to compare proper median inference speed.'
           'Use 5M-D audit: supply the actual prior 5L MIDI and separately loaded ground-truth MIDI in 5I.'
           'Manually confirm correct audio/score alignment and successful 5M-C pause/resume at 5-second boundaries.'
           'Export a local JSON audit report without uploading raw audio or full MIDI.'
           'Do not claim faster Large 2.74GB inference or quality improvement before true on-device tests.'
           'Original MuScriptor native C++ model weights and algorithm unchanged.'
          ) -join [Environment]::NewLine | Set-Content (Join-Path $appRoot 'README-STAGE5M-D.txt')
          @(
           'NOTIQ Stage 5N — Audio-derived velocity experimental edition'
           'Velocity proxy is OFF by default; activate it manually from Chất lượng MIDI.'
           'RMS-derived per-track volume is NOT recovered key pressure and is inaccurate in dense ensembles.'
           'Original MIDI note pitch/onsets/offsets are preserved; Ctrl+Z reverts the velocity edit.'
           'CC64 remains user-controlled or comes from optional separate Piano V2.'
           'This is not a production release. Benchmark actual Large inference and musical quality locally.'
          ) -join [Environment]::NewLine | Set-Content (Join-Path $appRoot 'README-STAGE5N.txt')
          if(-not (Test-Path (Join-Path $appRoot 'NOTIQ-Stage5-FullSong.exe'))){throw 'Portable EXE missing'}
          if(-not (Test-Path (Join-Path $appRoot 'resources/app.asar'))){throw 'Electron ASAR missing'}
          @(
           'NOTIQ Stage 5N-B — conservative note diagnostics & duplicate cleanup'
           'Click 5N-B in Chất lượng MIDI to review extra, unmatched and offset-warning notes.'
           'Dedupe is opt-in. Actual pitch, onset and note-off are unchanged for retained notes.'
           'Any reference F1/onset/offset regression blocks cleanup. Undo is available.'
           'Requires separately supplied same-performance MIDI reference to flag missing/extra notes.'
           'No automatic reconstruction of missing notes or expressive pedal from this check.'
           'MuScriptor core native inference and checkpoint binary are unchanged.'
           'Not a production release. Check actual Large 2.74GB accuracy on long songs locally.'
          ) -join [Environment]::NewLine | Set-Content (Join-Path $appRoot 'README-STAGE5NB.txt')
          @(
            'NOTIQ Stage 5N-C — Per-note expressive velocity manual editor'
            'Select a note in the Piano Roll to edit 1..127 velocity precisely.'
            'Slider values are drafts; Apply creates a single Undo step (Ctrl+Z).'
            'Listen before/after uses same instrument and normalized track/master levels.'
            'Live MIDI SoundFont playback retains MuScriptor default 100/127 as baseline.'
            'MIDI Type 1 / Kontakt stem files store real individual note-on velocities.'
            'SoundFont gain is NOT physical key pressure, piano timbre or full acoustic modeling.'
            'AI core, original detected pitches/note timing and external model weights unchanged.'
            'This is an experimental QA preview, NOT a production-ready release.'
          ) -join [Environment]::NewLine | Set-Content (Join-Path $appRoot 'README-STAGE5NC.txt')
          Write-Host 'NOTIQ_STAGE5NC_WINDOWS_VELOCITY_PACK_PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: NOTIQ-Stage5NC-PerNoteVelocity-Windows-Preview
          path: notiq-stage5md-base/
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
