name: NOTIQ Stage 5 - HTTPS pthread4 preview integrity QA
on:
  push:
    branches:
      - preview/notiq-pthread4-https
    paths:
      - .github/workflows/notiq-stage5-https-preview-once.yml
permissions:
  contents: read
jobs:
  preview-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Verify exact approved pthread4 compiled artifacts and security header isolation
        run: |
          node --test notiq-ai-core/tests/source-integrity.test.mjs
          cmp -s web/public/notiq-core/notiq-ai-core.js notiq-ai-core/qa/pthread4-artifacts/notiq-ai-core.js
          cmp -s web/public/notiq-core/notiq-ai-core.wasm notiq-ai-core/qa/pthread4-artifacts/notiq-ai-core.wasm
          node -e "const fs=require('fs');const b=fs.readFileSync('web/public/notiq-core/notiq-ai-core.wasm');if(!WebAssembly.validate(b)||b.length!==1321870)throw Error('Unverified WASM or size');console.log('NOTIQ_APPROVED_PTHREAD4_WASM',b.length)"
          grep -F 'Cross-Origin-Opener-Policy: same-origin' web/public/_headers
          grep -F 'Cross-Origin-Embedder-Policy: require-corp' web/public/_headers
          grep -F 'VITE_NOTIQ_WEB_AI=1' web/.env.production
          grep -F 'VITE_NOTIQ_MODEL_CACHE=0' web/.env.production
      - name: Build real Vite GUI in production mode using ONLY preview-local env
        run: |
          npm install --prefix web --no-fund --no-audit
          npm run --prefix web build
          test -s web/dist/notiq-core/notiq-ai-core.wasm
          test -s web/dist/notiq-core/notiq-ai-core.js
          test -s web/dist/_headers
          cmp -s web/dist/notiq-core/notiq-ai-core.wasm notiq-ai-core/qa/pthread4-artifacts/notiq-ai-core.wasm
          node -e "const fs=require('fs');let js=fs.readdirSync('web/dist/assets').filter(n=>n.endsWith('.js')); let c=js.map(n=>fs.readFileSync('web/dist/assets/'+n,'utf8')).join('');if(!c.includes('NOTIQ Core (WebAssembly)')) throw Error('AI did not build into preview');console.log('NOTIQ_PREVIEW_AI_COMPILED',js.length)"
      - name: Browser smoke test of built UI under COOP/COEP
        run: |
          npm install --prefix /tmp/notiq-preview-playwright --no-fund --no-audit playwright-core@1.56.1
          node --input-type=module <<'JS'
          import {createServer} from 'node:http';
          import {readFile} from 'node:fs/promises';
          import {resolve,join} from 'node:path';
          import {chromium} from '/tmp/notiq-preview-playwright/node_modules/playwright-core/index.mjs';
          const root=resolve('web/dist');
          const server=createServer(async(req,res)=>{
            let file=resolve(join(root,decodeURIComponent(new URL(req.url,'http://127.0.0.1').pathname)));
            if(file===root)file=join(root,'index.html');
            if(!file.startsWith(root+'/')){res.writeHead(403);res.end();return;}
            try {
              const data=await readFile(file);
              const mime=file.endsWith('.wasm')?'application/wasm':file.endsWith('.js')?'application/javascript':file.endsWith('.html')?'text/html':'application/octet-stream';
              res.writeHead(200,{'Content-Type':mime,'Cross-Origin-Opener-Policy':'same-origin','Cross-Origin-Embedder-Policy':'require-corp'});
              res.end(data);
            }catch{res.writeHead(404);res.end();}
          });
          await new Promise(done=>server.listen(4173,'127.0.0.1',done));
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          try{
            const page=await browser.newPage();
            const errors=[];page.on('pageerror',err=>errors.push(err.message));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            const state=await page.evaluate(async()=>{
              const wasm=await fetch('/notiq-core/notiq-ai-core.wasm');
              const js=await fetch('/notiq-core/notiq-ai-core.js');
              return {
                isolated:self.crossOriginIsolated,
                sab:typeof SharedArrayBuffer==='function',
                wasmOk:wasm.ok,
                wasmType:wasm.headers.get('content-type'),
                aiReadyText:document.body.innerText.includes('AI: NOTIQ Core (WebAssembly)'),
                jsOk:js.ok,
              };
            });
            console.log('NOTIQ_PREVIEW_LOCAL_BROWSER',JSON.stringify(state));
            if(errors.length||!state.isolated||!state.sab||!state.wasmOk||!state.jsOk||!state.aiReadyText)
              throw Error('Preview browser smoke QA failed '+JSON.stringify({errors,state}));
            console.log('NOTIQ_PREVIEW_LOCAL_SMOKE_PASS');
          }finally{await browser.close();await new Promise(resolve=>server.close(resolve))}
          JS
