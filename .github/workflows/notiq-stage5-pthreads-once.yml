name: NOTIQ Stage 5 - experimental multi-threaded WASM A/B
on:
  push:
    branches: [experiment/notiq-stage5-wasm-pthreads]
    paths: [.github/workflows/notiq-stage5-pthreads-once.yml]
permissions:
  contents: read
concurrency:
  group: notiq-wasm-pthreads-experimental
  cancel-in-progress: true
jobs:
  browser-real-pthreads:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Ensure the pinned MuScriptor source is unchanged
        run: |
          node --test notiq-ai-core/tests/source-integrity.test.mjs
          test -s web/public/notiq-core/notiq-ai-core.wasm
      - name: Install Emscripten SDK 4.0.7 and pinned ggml
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/notiq-emsdk
          /tmp/notiq-emsdk/emsdk install 4.0.7
          /tmp/notiq-emsdk/emsdk activate 4.0.7
          git init /tmp/notiq-ggml
          git -C /tmp/notiq-ggml remote add origin https://github.com/ggml-org/ggml.git
          git -C /tmp/notiq-ggml fetch --depth 1 origin e91ded11bdcd78c42f9c8d3978ff6686eb4c1226
          git -C /tmp/notiq-ggml checkout --detach FETCH_HEAD
          test "$(git -C /tmp/notiq-ggml rev-parse HEAD)" = e91ded11bdcd78c42f9c8d3978ff6686eb4c1226
      - name: Compile actual four-thread MuScriptor and ggml to WASM32
        run: |
          . /tmp/notiq-emsdk/emsdk_env.sh
          emcmake cmake -S notiq-ai-core -B /tmp/notiq-pthread-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNOTIQ_WASM_PTHREADS=ON \
            -DFETCHCONTENT_SOURCE_DIR_GGML=/tmp/notiq-ggml
          cmake --build /tmp/notiq-pthread-build --target notiq_ai_core --parallel 2
          ls -lh /tmp/notiq-pthread-build/notiq-ai-core.js \
            /tmp/notiq-pthread-build/notiq-ai-core.wasm \
            /tmp/notiq-pthread-build/notiq-ai-core.worker.js
          node -e "const fs=require('fs');const b=fs.readFileSync('/tmp/notiq-pthread-build/notiq-ai-core.wasm');if(!WebAssembly.validate(b))throw Error('Invalid pthread4 WASM'); console.log('NOTIQ_PTHREAD_BINARY_VALID',b.length)"
      - name: Prepare same original CC BY 4.0 music and pinned noncommercial model
        run: |
          curl -fsSL --retry 3 \
            'https://raw.githubusercontent.com/DamRsn/muscriptor.cpp/c8adc019677ed3479fa3c22c1a117d662382f347/testdata/audio/fixture_3chunks_16k.wav' \
            -o /tmp/notiq-original-15s.wav
          test "$(git hash-object /tmp/notiq-original-15s.wav)" = acfa9329d65816633abc3ee5cc3c7662bf403669
          curl -fL --retry 3 --connect-timeout 30 --max-time 600 \
            'https://huggingface.co/DamRsn/muscriptor-gguf/resolve/d7045f94e8b19427f4ff9542975035e66596e51c/v1/muscriptor-small-f16.gguf' \
            -o /tmp/notiq-small.gguf
          echo '925f55af65a20ebc4f8b45ceaf095a12b72493d436cb112623cd0041a1af23d4  /tmp/notiq-small.gguf' | sha256sum -c -
      - name: Compare true single-thread vs pthread4 451-note output under COOP COEP in Chromium
        timeout-minutes: 21
        run: |
          mkdir -p /tmp/notiq-pthreads-ab/baseline/web /tmp/notiq-pthreads-ab/pthread4/web
          cp web/public/notiq-core/notiq-ai-core.js web/public/notiq-core/notiq-ai-core.wasm /tmp/notiq-pthreads-ab/baseline/
          cp /tmp/notiq-pthread-build/notiq-ai-core.js /tmp/notiq-pthread-build/notiq-ai-core.wasm \
            /tmp/notiq-pthread-build/notiq-ai-core.worker.js /tmp/notiq-pthreads-ab/pthread4/
          for d in baseline pthread4; do
            cp notiq-ai-core/web/worker.mjs notiq-ai-core/web/midi-export.mjs /tmp/notiq-pthreads-ab/$d/web/
            cp notiq-ai-core/qa/browser.html /tmp/notiq-pthreads-ab/$d/web/
          done
          npm install --prefix /tmp/notiq-pthreads-playwright --no-audit --no-fund playwright-core@1.56.1
          timeout 20m node notiq-ai-core/qa/pthreads-benchmark.mjs
