name: NOTIQ 5H Dual Engine Compare Tests
on:
  push:
    branches: [feature/notiq-stage5h-dual-engine-comparison]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install NOTIQ Web
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Compile full React application
        working-directory: web
        run: npm run build
      - name: Stage5H one-to-one pitch/onset matcher and baseline tests
        working-directory: web
        run: node --experimental-strip-types --test tests/compare-engines.test.mts
      - name: Existing MIDI and Piano regressions
        working-directory: web
        run: |
          npm run test:daw
          npm run test:piano
          npm run test:soundfont
