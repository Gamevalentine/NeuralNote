name: CI build

# Temporary QA-only branch: use the EXISTING default-branch workflow ID to
# dispatch NOTIQ 5M-D from this branch without changing main or creating releases.
# Run CI build with branch: ci/notiq-5md-ui-dispatch.
# All legacy macOS / Windows release jobs are deliberately absent on this branch.
on:
  workflow_dispatch:
    inputs:
      windows_x64:
        description: 'Legacy CI input (ignored in this isolated test branch)'
        type: boolean
        default: false
      macos_arm64:
        description: 'Legacy CI input (ignored in this isolated test branch)'
        type: boolean
        default: false
      macos_x64:
        description: 'Legacy CI input (ignored in this isolated test branch)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse any non-isolated branch or non-manual event
        shell: bash
        run: |
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch" || exit 2
          test "${GITHUB_REF}" = "refs/heads/ci/notiq-5md-ui-dispatch" || exit 3
          echo 'NOTIQ_5MD_DISPATCH_BRANCH_PREFLIGHT_PASS'
  notiq-5md-windows:
    needs: preflight
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/notiq-stage5md-windows.yml
