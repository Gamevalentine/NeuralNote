name: NOTIQ Stage 5J Browser UI Smoke
on:
  push:
    branches: [feature/notiq-stage5j-web-evaluation]
    paths:
      - .github/workflows/notiq-stage5j-browser.yml
      - notiq-ai-core/qa/web5j-browser.mjs
      - web/src/WebBenchmarkPanel.tsx
      - web/src/App.tsx
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome-web-5j:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build WebAssembly-enabled preview React UI
        working-directory: web
        env:
          VITE_NOTIQ_WEB_AI: '1'
        run: |
          npm install --no-fund --no-audit
          npm run build
      - name: Browser test Web 5J uploads, no fabricated inference or F1
        run: |
          npm install --prefix /tmp/notiq-5j-playwright --no-audit --no-fund playwright-core@1.56.1
          node notiq-ai-core/qa/web5j-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notiq-stage5j-web-browser-evidence
          path: /tmp/notiq-stage5j-browser-panel.png
          if-no-files-found: warn
